name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify UTF-8 BOM on C# files
        run: bash scripts/check-cs-bom.sh

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.100-rc.1.26425.128'
          dotnet-quality: 'preview'

      - name: Restore MAUI workload set
        run: dotnet workload restore

      - name: Restore
        run: dotnet restore MauiBootstrapTheme.sln

      - name: Build MauiBootstrapTheme.Build
        run: dotnet build src/MauiBootstrapTheme.Build -c Release --no-restore

      - name: Build MauiBootstrapTheme
        run: dotnet build src/MauiBootstrapTheme -c Release --no-restore

      - name: Build default themes
        run: dotnet build src/MauiBootstrapTheme.Themes.Default -c Release --no-restore

      - name: Run tests
        run: dotnet test tests/MauiBootstrapTheme.Tests -c Release --no-restore

      - name: Run build validation
        run: dotnet run --project tests/MauiBootstrapTheme.Build.Tests -c Release -f net11.0 -- samples/MauiBootstrapTheme.Sample/Resources/Themes "$RUNNER_TEMP/bootstrap-theme-output"

      - name: Build XAML sample
        run: dotnet build samples/MauiBootstrapTheme.Sample -c Release -f net11.0-maccatalyst --no-restore

      - name: Build Blazor sample
        run: dotnet build samples/MauiBootstrapTheme.Sample.Blazor -c Release -f net11.0-maccatalyst --no-restore

      - name: Build Reactor sample
        run: dotnet build samples/MauiBootstrapTheme.Sample.Reactor -c Release -f net11.0-maccatalyst --no-restore

  build-windows-libraries:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.100-rc.1.26425.128'
          dotnet-quality: 'preview'

      - name: Restore MAUI workload set
        run: dotnet workload restore

      - name: Restore
        run: dotnet restore MauiBootstrapTheme.sln

      - name: Build .NET 10 Windows libraries
        run: |
          dotnet build src/MauiBootstrapTheme -c Release -f net10.0-windows10.0.19041.0 --no-restore
          dotnet build src/MauiBootstrapTheme.Themes.Default -c Release -f net10.0-windows10.0.19041.0 --no-restore

      - name: Build .NET 11 Windows libraries
        run: |
          dotnet build src/MauiBootstrapTheme -c Release -f net11.0-windows10.0.19041.0 --no-restore
          dotnet build src/MauiBootstrapTheme.Themes.Default -c Release -f net11.0-windows10.0.19041.0 --no-restore

  pack:
    runs-on: macos-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Verify UTF-8 BOM on C# files
        run: bash scripts/check-cs-bom.sh

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.100-rc.1.26425.128'
          dotnet-quality: 'preview'

      - name: Restore MAUI workload set
        run: dotnet workload restore

      - name: Restore
        run: dotnet restore MauiBootstrapTheme.sln

      - name: Build MauiBootstrapTheme.Build
        run: dotnet build src/MauiBootstrapTheme.Build -c Release --no-restore

      - name: Build Plugin.Maui.BootstrapTheme
        run: dotnet build src/MauiBootstrapTheme -c Release --no-restore

      - name: Pack MauiBootstrapTheme.Build
        run: dotnet pack src/MauiBootstrapTheme.Build -c Release --no-build -o artifacts

      - name: Pack Plugin.Maui.BootstrapTheme
        run: dotnet pack src/MauiBootstrapTheme -c Release --no-build -o artifacts

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
          retention-days: 30
